plugins { id 'com.android.application' }
android {
 namespace 'com.orient.ortts.demo'
 compileSdk 34
  defaultConfig { applicationId (project.hasProperty('qa') ? 'com.orient.ortts.qa' : project.hasProperty('bundled') ? 'com.orient.ortts.bundled' : 'com.orient.ortts'); resValue 'string', 'app_name', (project.hasProperty('qa') ? 'OrTTS MOSS 测试' : project.hasProperty('bundled') ? 'OrTTS · 内置权重' : 'OrTTS'); minSdk 28; targetSdk 34; versionCode 26; versionName (project.hasProperty('qa') ? '0.4.0-moss-qa' : '0.4.0'); ndk { abiFilters 'arm64-v8a' } }
 sourceSets { main {
  assets.srcDirs += layout.buildDirectory.dir('generated/licenseAssets')
  assets.srcDirs += layout.buildDirectory.dir('generated/speechAssets')
  if(project.findProperty('g2pAssetsDir')) assets.srcDirs += file(project.property('g2pAssetsDir'))
  if (project.findProperty('nativeLibsDir')) jniLibs.srcDirs += file(project.property('nativeLibsDir'))
  if (project.findProperty('modelAssetsDir')) assets.srcDirs += file(project.property('modelAssetsDir'))
 } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildFeatures { buildConfig true }
 defaultConfig { buildConfigField 'String', 'NATIVE_CPU_PROFILE', '"'+(project.findProperty('nativeCpuProfile') ?: 'arm64-i8mm')+'"' }
 androidResources { noCompress += ['zip','gguf','f32','safetensors'] }
 packagingOptions { jniLibs { useLegacyPackaging true } }
 buildTypes { release { minifyEnabled false } }
}
dependencies {}

// Distribute third-party notices with the native libraries in every APK.
def prepareLicenseAssets = tasks.register('prepareLicenseAssets', Copy) {
 from(rootProject.file('../licenses')) { into 'licenses' }
 from(rootProject.file('../NOTICE.md')) { into 'licenses' }
 from(rootProject.file('../LICENSE')) { into 'licenses'; rename { 'OrTTS-Apache-2.0.txt' } }
 into layout.buildDirectory.dir('generated/licenseAssets')
}
tasks.named('preBuild').configure { dependsOn prepareLicenseAssets }
def prepareSpeechAssets = tasks.register('prepareSpeechAssets', Copy) {
 from(rootProject.file('../runtime/models/catalog.example.json')) { rename { 'SpeechModels.json' } }
 into layout.buildDirectory.dir('generated/speechAssets')
}
tasks.named('preBuild').configure { dependsOn prepareSpeechAssets }
