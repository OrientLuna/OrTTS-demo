plugins { id 'com.android.application' }
android {
 namespace 'com.orient.ortts.demo'
 compileSdk 34
  defaultConfig { applicationId (project.hasProperty('qa') ? 'com.orient.ortts.qa' : project.hasProperty('bundled') ? 'com.orient.ortts.bundled' : 'com.orient.ortts'); resValue 'string', 'app_name', (project.hasProperty('qa') ? 'OrTTS 测试' : project.hasProperty('bundled') ? 'OrTTS · 内置权重' : 'OrTTS'); minSdk 28; targetSdk 34; versionCode 28; versionName (project.hasProperty('qa') ? '0.4.3-rc-qa' : '0.4.3-rc'); ndk { abiFilters 'arm64-v8a' } }
 sourceSets { main {
  assets.srcDirs += layout.buildDirectory.dir('generated/licenseAssets')
  assets.srcDirs += layout.buildDirectory.dir('generated/speechAssets')
  if(project.findProperty('g2pAssetsDir')) assets.srcDirs += file(project.property('g2pAssetsDir'))
  if (project.findProperty('nativeLibsDir')) jniLibs.srcDirs += file(project.property('nativeLibsDir'))
  if (project.findProperty('modelAssetsDir')) assets.srcDirs += file(project.property('modelAssetsDir'))
 } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildFeatures { buildConfig true }
 defaultConfig { buildConfigField 'String', 'NATIVE_CPU_PROFILE', '"'+(project.findProperty('nativeCpuProfile') ?: 'arm64-i8mm')+'"' }
 androidResources { noCompress += ['zip','gguf','f32','safetensors'] }
 packagingOptions { jniLibs { useLegacyPackaging true } }
 buildTypes { release { minifyEnabled false } }
}
dependencies {}

// Distribute third-party notices with the native libraries in every APK.
def prepareLicenseAssets = tasks.register('prepareLicenseAssets', Copy) {
 from(rootProject.file('../licenses')) { into 'licenses' }
 from(rootProject.file('../NOTICE.md')) { into 'licenses' }
 from(rootProject.file('../LICENSE')) { into 'licenses'; rename { 'OrTTS-Apache-2.0.txt' } }
 into layout.buildDirectory.dir('generated/licenseAssets')
}
tasks.named('preBuild').configure { dependsOn prepareLicenseAssets }
def prepareSpeechAssets = tasks.register('prepareSpeechAssets') {
 def baseCatalog = rootProject.file('../runtime/models/catalog.example.json')
 def mossCatalog = rootProject.file('../runtime/models/moss-nano.json')
 def outputDir = layout.buildDirectory.dir('generated/speechAssets')
 inputs.files(baseCatalog, mossCatalog)
 outputs.dir(outputDir)
 doLast {
  def parser = new groovy.json.JsonSlurper()
  def catalog = parser.parse(baseCatalog, 'UTF-8')
  def extra = parser.parse(mossCatalog, 'UTF-8')
  if(catalog.schema != extra.schema) throw new GradleException('Model catalog schema mismatch')
  def ids = catalog.models.collect { it.id } as Set
  extra.models.each { model ->
   if(!ids.add(model.id)) throw new GradleException('Duplicate model id: ' + model.id)
   catalog.models.add(model)
  }
  def directory = outputDir.get().asFile
  directory.mkdirs()
  new File(directory, 'SpeechModels.json').setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(catalog)), 'UTF-8')
 }
}
tasks.named('preBuild').configure { dependsOn prepareSpeechAssets }
